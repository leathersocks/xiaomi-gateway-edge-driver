name: xiaomi-gateway
components:
- id: main
  capabilities:
  - id: locketforest19027.xiaomiGatewayStatus
    version: 1
  categories:
  - name: Hub
preferences:
- title: IP address
  name: gatewayIp
  description: IPv4 address used for the Xiaomi miIO UDP health check.
  required: false
  preferenceType: string
  definition:
    minLength: 0
    maxLength: 64
    stringType: text
    default: ''
- title: Health check interval
  name: checkInterval
  description: How often the driver checks the gateway over UDP 54321.
  required: false
  preferenceType: integer
  definition:
    minimum: 30
    maximum: 3600
    default: 60
- title: Auto child discovery
  name: autoChildDiscovery
  description: Discover non-BLE Xiaomi child devices over authenticated miIO. Requires
    TOKEN. Known BLE sensor registration is independent.
  required: false
  preferenceType: boolean
  definition:
    default: false
- title: TOKEN
  name: gatewayToken
  description: Optional 32-hex-character miIO TOKEN for this gateway. Required only
    for authenticated child discovery/Zigbee polling.
  required: false
  preferenceType: string
  definition:
    minLength: 0
    maxLength: 32
    stringType: text
    default: ''
- title: Zigbee state polling
  name: childStatePolling
  description: Poll supported auto-discovered Zigbee child values. Requires Auto child
    discovery and TOKEN.
  required: false
  preferenceType: boolean
  definition:
    default: false
- title: Zigbee poll interval
  name: childPollInterval
  description: Polling interval for supported Zigbee child values. Minimum 30 seconds.
  required: false
  preferenceType: integer
  definition:
    minimum: 30
    maximum: 3600
    default: 60
- title: BLE via MQTT
  name: bleMqttEnabled
  description: Receive BLE advertisements through this gateway's MQTT broker. Enable
    on the gateway running openmiio/Mosquitto.
  required: false
  preferenceType: boolean
  definition:
    default: false
- title: BLE MQTT broker IP
  name: bleMqttBrokerIp
  description: Optional MQTT broker IPv4 address. Leave blank to use this gateway's
    IP address.
  required: false
  preferenceType: string
  definition:
    minLength: 0
    maxLength: 64
    stringType: text
    default: ''
- title: BLE MQTT port
  name: bleMqttPort
  description: MQTT TCP port exposed by the local openmiio/Mosquitto broker.
  required: false
  preferenceType: integer
  definition:
    minimum: 1
    maximum: 65535
    default: 1883
